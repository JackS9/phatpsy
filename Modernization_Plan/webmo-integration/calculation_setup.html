<!-- webmo/plugins/phatpsy/templates/calculation_setup.html -->
<!-- PHATPSY Calculation Setup Form -->
<div id="phatpsy-setup" class="calculation-setup">
    <h3>PHATPSY Calculation Setup</h3>
    
    <div class="method-selection">
        <label for="phatpsy-method">Theoretical Method:</label>
        <select id="phatpsy-method" name="method">
            <option value="PHATPSY-HF">Standard PHATPSY Hartree-Fock</option>
            <option value="PHATPSY-GCHF">Grand-Canonical Hartree-Fock</option>
            <option value="PHATPSY-EWMO">Energy-Weighted Maximum Overlap</option>
            <option value="PHATPSY-LSP" disabled>Localized Spin-Polarized (Coming Soon)</option>
        </select>
    </div>
    
    <div class="basis-set-selection">
        <label for="phatpsy-basis">Basis Set:</label>
        <select id="phatpsy-basis" name="basis_set">
            <option value="STO-DZ">Slater Double-Zeta</option>
            <option value="STO-DZP" selected>Slater Double-Zeta + Polarization</option>
            <option value="STO-TZ">Slater Triple-Zeta</option>
            <option value="STO-TZP">Slater Triple-Zeta + Polarization</option>
        </select>
    </div>
    
    <div class="calculation-options">
        <h4>PHATPSY-Specific Options</h4>
        
        <div class="option-group">
            <input type="checkbox" id="use-ewmo" name="use_ewmo" checked>
            <label for="use-ewmo">Use Energy-Weighted Maximum Overlap</label>
            <span class="help-text">Generate molecular orbitals using PHATPSY's unique EWMO method</span>
        </div>
        
        <div class="option-group">
            <input type="checkbox" id="separated-atoms" name="separated_atoms" checked>
            <label for="separated-atoms">Start with Separated Atoms</label>
            <span class="help-text">Begin calculation with isolated atomic calculations</span>
        </div>
        
        <div class="option-group">
            <input type="checkbox" id="charge-damping" name="charge_damping">
            <label for="charge-damping">Automatic Charge Damping</label>
            <span class="help-text">Use adaptive damping for charge transfer between atoms</span>
        </div>
        
        <div class="option-group">
            <label for="fermi-temp">Fermi Temperature:</label>
            <input type="number" id="fermi-temp" name="fermi_temperature" value="100000" min="1000" max="1000000">
            <span class="help-text">Temperature for Grand-Canonical ensemble (K)</span>
        </div>
